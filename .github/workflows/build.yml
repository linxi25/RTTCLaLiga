name: Update ratings site

on:
  push:
    branches: [main]
  schedule:
    # Friday 10:47 pm Central (04:47 UTC Sat) — after league night
    - cron: "47 4 * * 6"
    # Saturday 10:17 am Central (16:17 UTC) — catch matches certified late
    - cron: "17 16 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography

      - name: Fetch new results from StadiumTT
        if: github.event_name != 'push'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/fetch_stadiumtt.py
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Results from StadiumTT"
            git push
          fi

      - name: Compute ratings and build page
        run: python scripts/build.py
        env:
          SITE_ANSWERS: ${{ secrets.SITE_ANSWERS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
